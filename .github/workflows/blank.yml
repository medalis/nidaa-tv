name: Nidaa Écran — APK Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Construire l'APK
        working-directory: nidaa-tv-github
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PnidaaScreenUrl=https://nidaa-ecran.netlify.app
          cp app/build/outputs/apk/debug/app-debug.apk nidaa-ecran.apk
      - uses: actions/upload-artifact@v4
        with: { name: nidaa-ecran-apk, path: nidaa-tv-github/nidaa-ecran.apk }
      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-${{ github.run_number }}
          name: Nidaa Écran APK ${{ github.run_number }}
          files: nidaa-tv-github/nidaa-ecran.apk
          body: "Application Android TV Nidaa Écran. Installer l'APK sur la box et l'ouvrir : le code d'appairage s'affiche."
